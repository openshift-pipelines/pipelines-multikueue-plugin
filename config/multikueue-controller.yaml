apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
  labels:
    control-plane: pipelines-multikueue-controller
    app.kubernetes.io/app: pipelines-multikueue-controller
spec:
  selector:
    matchLabels:
      control-plane: pipelines-multikueue-controller
      app.kubernetes.io/name: tekton-kueue
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: controller
      labels:
        control-plane: pipelines-multikueue-controller
        app.kubernetes.io/name: tekton-kueue
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /controller
        args:
          - controller
          - --leader-elect
          - --health-probe-bind-address=:8081
          - --metrics-bind-address=:8443
        image: controller:latest
        imagePullPolicy: Always
        name: controller
        # The operator catalogs, channels and namespaces below are compiled
        # into the image. To pin or upgrade one without rebuilding, change
        # env: [] to env: and uncomment the desired name/value pairs below. The
        # controller reads them on every reconcile.
        env: []
        # - name: PIPELINES_OPERATOR_CHANNEL
        #   value: pipelines-1.24
        # - name: KUEUE_OPERATOR_CHANNEL
        #   value: stable-v1.5
        # - name: CERT_MANAGER_OPERATOR_CHANNEL
        #   value: stable-v1
        # - name: PIPELINES_OPERATOR_NAMESPACE
        #   value: openshift-operators
        # - name: KUEUE_NAMESPACE
        #   value: openshift-kueue-operator
        # - name: CERT_MANAGER_OPERATOR_NAMESPACE
        #   value: cert-manager-operator
        # The CatalogSource the Pipelines operator is subscribed from, for
        # running a build the released catalog does not carry. It must exist in
        # the openshift-marketplace namespace on every cluster the addon
        # installs the operator on, and only applies to Subscriptions the
        # controller creates. Kueue and cert-manager always come from
        # redhat-operators.
        # - name: PIPELINES_OPERATOR_CATALOG
        #   value: redhat-operators
        # Set to "true" to have the hub install the Pipelines operator when
        # nothing on it is subscribed to the package yet. Managed clusters
        # always get it.
        # - name: INSTALL_PIPELINES_ON_HUB
        #   value: "true"
        ports:
        - containerPort: 8443
          name: metrics-server
          protocol: TCP
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts: []
      volumes: []
      serviceAccountName: pipelines-multikueue-plugin-controller
      terminationGracePeriodSeconds: 10
