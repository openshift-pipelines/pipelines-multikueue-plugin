apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
  labels:
    control-plane: pipelines-multikueue-controller
    app.kubernetes.io/app: pipelines-multikueue-plugin
spec:
  selector:
    matchLabels:
      control-plane: pipelines-multikueue-controller
      app.kubernetes.io/name: tekton-kueue
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: controller
      labels:
        control-plane: pipelines-multikueue-controller
        app.kubernetes.io/name: tekton-kueue
    spec:
      serviceAccountName: controller
      containers:
        - command:
            - /controller
          args:
            - controller
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8443
          image: controller:latest
          imagePullPolicy: Always
          name: controller
          env:
            - name: SYSTEM_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONFIG_LOGGING_NAME
              value: config-logging
            - name: CONFIG_OBSERVABILITY_NAME
              value: config-observability
            - name: METRICS_DOMAIN
              value: kueue.x-k8s.io/pipelines-multikueue-plugin
            - name: KUEUE_NAMESPACE
              value: kueue-system
            - name: KUBERNETES_MIN_VERSION
              value: "1.27.0"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
#            runAsUser: 65532
            capabilities:
              drop:
                - ALL
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

