apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
  labels:
    control-plane: pipelines-multikueue-controller
    app.kubernetes.io/app: pipelines-multikueue-controller
spec:
  selector:
    matchLabels:
      control-plane: pipelines-multikueue-controller
      app.kubernetes.io/name: tekton-kueue
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: controller
      labels:
        control-plane: pipelines-multikueue-controller
        app.kubernetes.io/name: tekton-kueue
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /controller
        args:
          - controller
          - --leader-elect
          - --health-probe-bind-address=:8081
          - --metrics-bind-address=:8443
        image: controller:latest
        imagePullPolicy: Always
        name: controller
        # The operator channels and namespaces below are compiled into the
        # image. To pin or upgrade one without rebuilding, change env: [] to
        # env: and uncomment the desired name/value pairs below. The controller
        # reads them on every reconcile.
        env: []
        # - name: PIPELINES_OPERATOR_CHANNEL
        #   value: pipelines-1.22
        # - name: KUEUE_OPERATOR_CHANNEL
        #   value: stable-v1.4
        # - name: CERT_MANAGER_OPERATOR_CHANNEL
        #   value: stable-v1
        # - name: PIPELINES_OPERATOR_NAMESPACE
        #   value: openshift-operators
        # - name: KUEUE_NAMESPACE
        #   value: openshift-kueue-operator
        # - name: CERT_MANAGER_OPERATOR_NAMESPACE
        #   value: cert-manager-operator
        ports:
        - containerPort: 8443
          name: metrics-server
          protocol: TCP
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts: []
      volumes: []
      serviceAccountName: pipelines-multikueue-plugin-controller
      terminationGracePeriodSeconds: 10
